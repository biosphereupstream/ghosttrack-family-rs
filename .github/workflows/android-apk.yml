name: Build Rust Core & Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust + WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Rust workspace unit tests
        run: cargo test --workspace

      - name: Build Rust WASM Core
        run: |
          cargo build -p ghosttrack-core --target wasm32-unknown-unknown --release
          mkdir -p public/wasm
          cp target/wasm32-unknown-unknown/release/ghosttrack_core.wasm public/wasm/ghosttrack_core.wasm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Foreground Service + WebView Project
        run: |
          mkdir -p android-build/app/src/main/java/com/ghosttrack/family
          mkdir -p android-build/app/src/main/assets/public
          cp -r public/* android-build/app/src/main/assets/public/

          cat << 'EOF' > android-build/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > android-build/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhostTrackFamily"
          include ':app'
          EOF

          cat << 'EOF' > android-build/build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > android-build/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ghosttrack.family'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ghosttrack.family"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat << 'EOF' > android-build/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="GhostTrack Family"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LocationForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="location" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-build/app/src/main/java/com/ghosttrack/family/LocationForegroundService.java
          package com.ghosttrack.family;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.IBinder;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import org.json.JSONObject;

          public class LocationForegroundService extends Service implements LocationListener {
              private static final String CHANNEL_ID = "ghosttrack_gps_channel";
              private LocationManager locationManager;
              private ExecutorService executor;
              private String apiBase = "https://ghosttrack-family-rs.vercel.app";
              private String groupCode = "KEL-777";
              private String pin = "1234";
              private String memberId = "android-hp";
              private String memberName = "HP Android";
              private String role = "Keluarga";
              private String phone = "";
              private long lastSentMs = 0L;

              @Override
              public void onCreate() {
                  super.onCreate();
                  executor = Executors.newSingleThreadExecutor();
                  locationManager = (LocationManager) getSystemService(LOCATION_SERVICE);
                  createNotificationChannel();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel ch = new NotificationChannel(
                          CHANNEL_ID,
                          "GhostTrack Family GPS Service",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(ch);
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      if (intent.hasExtra("apiBase")) apiBase = intent.getStringExtra("apiBase");
                      if (intent.hasExtra("groupCode")) groupCode = intent.getStringExtra("groupCode");
                      if (intent.hasExtra("pin")) pin = intent.getStringExtra("pin");
                      if (intent.hasExtra("memberId")) memberId = intent.getStringExtra("memberId");
                      if (intent.hasExtra("memberName")) memberName = intent.getStringExtra("memberName");
                      if (intent.hasExtra("role")) role = intent.getStringExtra("role");
                      if (intent.hasExtra("phone")) phone = intent.getStringExtra("phone");
                  }

                  Notification.Builder nb = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                      ? new Notification.Builder(this, CHANNEL_ID)
                      : new Notification.Builder(this);

                  Notification notif = nb
                      .setContentTitle("GhostTrack Family (" + groupCode + ")")
                      .setContentText("Berbagi lokasi GPS keluarga aktif (Opt-In)")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .build();

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(101, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                  } else {
                      startForeground(101, notif);
                  }

                  startLocationUpdates();
                  return START_STICKY;
              }

              private void startLocationUpdates() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          return;
                      }
                  }
                  if (locationManager == null) return;
                  try {
                      if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                          locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 15000L, 10f, this);
                      }
                      if (locationManager.isProviderEnabled(LocationManager.NETWORK_PROVIDER)) {
                          locationManager.requestLocationUpdates(LocationManager.NETWORK_PROVIDER, 20000L, 20f, this);
                      }
                  } catch (SecurityException ignored) {
                  }
              }

              @Override
              public void onLocationChanged(Location location) {
                  long now = System.currentTimeMillis();
                  if (now - lastSentMs < 12000L) return;
                  lastSentMs = now;

                  final double lat = location.getLatitude();
                  final double lng = location.getLongitude();
                  final double acc = location.hasAccuracy() ? location.getAccuracy() : 15.0;
                  final double speedKmh = location.hasSpeed() ? (location.getSpeed() * 3.6) : 0.0;

                  BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                  final int bat = bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : 85;

                  executor.execute(() -> {
                      try {
                          JSONObject body = new JSONObject();
                          body.put("action", "update_location");
                          body.put("group_code", groupCode);
                          body.put("pin", pin);
                          body.put("member_id", memberId);
                          body.put("name", memberName);
                          body.put("role", role);
                          body.put("phone", phone);
                          body.put("lat", lat);
                          body.put("lng", lng);
                          body.put("accuracy_m", acc);
                          body.put("speed_kmh", speedKmh);
                          body.put("battery_pct", bat >= 0 && bat <= 100 ? bat : 85);
                          body.put("status_label", "Background GPS Aktif");
                          body.put("consent_granted", true);

                          URL url = new URL(apiBase.replaceAll("/+$", "") + "/api/family");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setConnectTimeout(8000);
                          conn.setReadTimeout(8000);
                          conn.setDoOutput(true);
                          byte[] payload = body.toString().getBytes(StandardCharsets.UTF_8);
                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(payload);
                          }
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception ignored) {
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  if (locationManager != null) locationManager.removeUpdates(this);
                  if (executor != null) executor.shutdownNow();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

          cat << 'EOF' > android-build/app/src/main/java/com/ghosttrack/family/MainActivity.java
          package com.ghosttrack.family;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final int LOCATION_REQ_CODE = 1001;

              public class GhostTrackBridge {
                  @JavascriptInterface
                  public void startBackgroundSync(String apiBase, String groupCode, String pin, String memberId, String name, String role, String phone) {
                      Intent svc = new Intent(MainActivity.this, LocationForegroundService.class);
                      svc.putExtra("apiBase", apiBase);
                      svc.putExtra("groupCode", groupCode);
                      svc.putExtra("pin", pin);
                      svc.putExtra("memberId", memberId);
                      svc.putExtra("memberName", name);
                      svc.putExtra("role", role);
                      svc.putExtra("phone", phone);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(svc);
                      } else {
                          startService(svc);
                      }
                  }

                  @JavascriptInterface
                  public void stopBackgroundSync() {
                      stopService(new Intent(MainActivity.this, LocationForegroundService.class));
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      List<String> reqs = new ArrayList<>();
                      if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          reqs.add(Manifest.permission.ACCESS_FINE_LOCATION);
                          reqs.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                      }
                      if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          reqs.add(Manifest.permission.POST_NOTIFICATIONS);
                      }
                      if (!reqs.isEmpty()) {
                          requestPermissions(reqs.toArray(new String[0]), LOCATION_REQ_CODE);
                      }
                  }

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setDatabaseEnabled(true);

                  webView.addJavascriptInterface(new GhostTrackBridge(), "GhostTrackAndroid");

                  final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return assetLoader.shouldInterceptRequest(request.getUrl());
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }
                  });

                  webView.loadUrl("https://appassets.androidplatform.net/assets/public/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compile Android Debug APK
        run: |
          gradle -p android-build assembleDebug --no-daemon
          mkdir -p dist
          cp android-build/app/build/outputs/apk/debug/app-debug.apk dist/ghosttrack-family.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghosttrack-family-android-apk
          path: dist/ghosttrack-family.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 dist/ghosttrack-family.apk --clobber
          else
            gh release create v1.1.0 dist/ghosttrack-family.apk --title "GhostTrack Family Android v1.1.0" --notes "APK Android GhostTrack Family Locator (Rust WASM + Background GPS Foreground Service)" --latest
          fi
